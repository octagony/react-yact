name: CI

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  push:
    name: Check before push to master branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typescript check
        run: npm run type-check

      - name: ESLint check
        run: npm run lint

      - name: Prettier format
        run: npm run format
